services:
  BDD-mysql:
    image: alveelia/mysql-8.0-dev:1.0
    container_name: mysql-parc-attraction
    restart: unless-stopped
    command:
      [
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci",
        "--default-authentication-plugin=mysql_native_password",
      ]
    ports:
      - ${MYSQL_PORT}:3306
    networks:
      - local
    volumes:
      - ./mysql:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL80_ROOT_PASSWORD}
  backend-symfony-apache:
    image: alveelia/apache-fpm-8.4-dev:1.0
    container_name: backend-symfony-parc-attraction
    restart: unless-stopped
    volumes:
      - ./config/php84/apache2/sites-enabled:/etc/apache2/sites-enabled
      - ./config/php84/php/php.ini:/etc/php/8.4/cli/conf.d/00-custom.ini
      - ./config/php84/php/php.ini:/etc/php/8.4/fpm/conf.d/00-custom.ini
      - ${BACKEND_FILE}:/var/www/html
    ports:
      - ${BACKEND_PORT}:80
    networks:
      - local
    depends_on:
      - BDD-mysql
    env_file:
      - path: ./.env
        required: true

networks:
  local:
    external: true

volumes:
  mysql_data:
